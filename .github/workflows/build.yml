name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.5.6)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore
        run: |
          STORE_PWD=$(openssl rand -base64 32)
          keytool -genkeypair \
            -keystore "${{ github.workspace }}/keystore.jks" \
            -alias tv \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PWD" -keypass "$STORE_PWD" \
            -dname "CN=CI Build, O=TV, L=CI, ST=CI, C=CN"
          cat > local.properties << EOF
          storeFile=${{ github.workspace }}/keystore.jks
          keyAlias=tv
          storePassword=$STORE_PWD
          EOF

      - name: Build all release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleLeanbackArm64_v8aRelease \
                    assembleLeanbackArmeabi_v7aRelease \
                    assembleMobileArm64_v8aRelease \
                    assembleMobileArmeabi_v7aRelease

      - name: Collect APKs
        id: apk
        run: |
          mkdir -p output
          cp Release/apk/*.apk output/ 2>/dev/null || true
          # Fallback: find APKs from build output
          find app/build/outputs/apk -name '*.apk' -path '*/release/*' -exec cp {} output/ \;
          ls -lh output/
          echo "count=$(ls output/*.apk 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-APKs-${{ github.run_number }}
          path: output/*.apk
          retention-days: 30

      - name: Determine release tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        id: tag
        run: echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: output/*.apk
          generate_release_notes: true
