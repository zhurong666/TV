name: Build Android APKs

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.mode }} APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: leanback
            tasks: ":app:assembleLeanbackArm64_v8aRelease :app:assembleLeanbackArmeabi_v7aRelease"
          - mode: mobile
            tasks: ":app:assembleMobileArm64_v8aRelease :app:assembleMobileArmeabi_v7aRelease"
    env:
      STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Set up Keystore (Custom or Random fallback)
        run: |
          if [ -n "${{ env.STORE_FILE_BASE64 }}" ]; then
            echo "Using custom keystore from secrets..."
            echo "${{ env.STORE_FILE_BASE64 }}" | base64 --decode > app/release.jks
            echo "storeFile=release.jks" >> local.properties
            echo "keyAlias=${{ env.KEY_ALIAS }}" >> local.properties
            echo "storePassword=${{ env.STORE_PASSWORD }}" >> local.properties
            echo "keyPassword=${{ env.KEY_PASSWORD }}" >> local.properties
          else
            echo "No keystore secrets found. Generating a random self-signed keystore..."
            keytool -genkeypair -v -keystore app/release.jks -alias temp_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass temp_password -keypass temp_password -dname "CN=SelfSigned, O=CI, C=US"
            echo "storeFile=release.jks" >> local.properties
            echo "keyAlias=temp_alias" >> local.properties
            echo "storePassword=temp_password" >> local.properties
            echo "keyPassword=temp_password" >> local.properties
          fi

      - name: Build with Gradle
        run: ./gradlew ${{ matrix.tasks }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-${{ matrix.mode }}-apks
          path: Release/apk/${{ matrix.mode }}-*.apk
