name: Build Android APKs

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.mode }} APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [leanback, mobile]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Set up Keystore (Optional)
        if: ${{ secrets.STORE_FILE_BASE64 != '' }}
        run: |
          echo "${{ secrets.STORE_FILE_BASE64 }}" | base64 --decode > app/release.jks
          echo "storeFile=release.jks" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Create Empty local.properties (Fallback if no signing)
        if: ${{ secrets.STORE_FILE_BASE64 == '' }}
        run: touch local.properties

      - name: Build with Gradle
        run: ./gradlew :app:assemble${{ matrix.mode }}Release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-${{ matrix.mode }}-apks
          path: Release/apk/*.apk
