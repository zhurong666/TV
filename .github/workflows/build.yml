name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.5.6)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDIA3_VERSION: '1.10.1-fongmi'
  NEXTLIB_VERSION: '1.10.0-0.12.1'

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download custom Media3 libraries
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/fish2018/webhtv.git /tmp/webhtv
          cd /tmp/webhtv
          git sparse-checkout set third_party/maven
          cp -r third_party/maven "$GITHUB_WORKSPACE/third_party/maven"

      - name: Patch settings.gradle for local Maven repo
        run: |
          sed -i 's|repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)|repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        maven { url = uri("$rootDir/third_party/maven") }|' settings.gradle
          # Remove the duplicate repositories block opener that sed creates
          # Actually let's just replace the whole block properly
          cat > settings.gradle << 'SETTINGS'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  mavenCentral()
                  google()
              }
          }

          plugins {
              id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  maven { url = uri("$rootDir/third_party/maven") }
                  mavenCentral()
                  google()
                  flatDir { dirs "$rootDir/app/libs" }
                  maven { url = "https://jitpack.io" }
              }
          }

          include ':app'
          include ':catvod'
          include ':chaquo'
          include ':quickjs'
          rootProject.name = "TV"
          SETTINGS

      - name: Patch libs.versions.toml with media3 deps
        run: |
          cat >> gradle/libs.versions.toml << TOML

          media3 = "${MEDIA3_VERSION}"
          nextlib = "${NEXTLIB_VERSION}"

          [libraries.media3-common]
          group = "androidx.media3"
          name = "media3-common"
          version.ref = "media3"

          [libraries.media3-exoplayer]
          group = "androidx.media3"
          name = "media3-exoplayer"
          version.ref = "media3"

          [libraries.media3-exoplayer-dash]
          group = "androidx.media3"
          name = "media3-exoplayer-dash"
          version.ref = "media3"

          [libraries.media3-exoplayer-hls]
          group = "androidx.media3"
          name = "media3-exoplayer-hls"
          version.ref = "media3"

          [libraries.media3-exoplayer-rtsp]
          group = "androidx.media3"
          name = "media3-exoplayer-rtsp"
          version.ref = "media3"

          [libraries.media3-exoplayer-smoothstreaming]
          group = "androidx.media3"
          name = "media3-exoplayer-smoothstreaming"
          version.ref = "media3"

          [libraries.media3-extractor]
          group = "androidx.media3"
          name = "media3-extractor"
          version.ref = "media3"

          [libraries.media3-datasource]
          group = "androidx.media3"
          name = "media3-datasource"
          version.ref = "media3"

          [libraries.media3-datasource-okhttp]
          group = "androidx.media3"
          name = "media3-datasource-okhttp"
          version.ref = "media3"

          [libraries.media3-datasource-rtmp]
          group = "androidx.media3"
          name = "media3-datasource-rtmp"
          version.ref = "media3"

          [libraries.media3-database]
          group = "androidx.media3"
          name = "media3-database"
          version.ref = "media3"

          [libraries.media3-decoder]
          group = "androidx.media3"
          name = "media3-decoder"
          version.ref = "media3"

          [libraries.media3-session]
          group = "androidx.media3"
          name = "media3-session"
          version.ref = "media3"

          [libraries.media3-ui]
          group = "androidx.media3"
          name = "media3-ui"
          version.ref = "media3"

          [libraries.media3-ui-danmaku]
          group = "androidx.media3"
          name = "media3-ui-danmaku"
          version.ref = "media3"

          [libraries.media3-container]
          group = "androidx.media3"
          name = "media3-container"
          version.ref = "media3"

          [libraries.media3-effect]
          group = "androidx.media3"
          name = "media3-effect"
          version.ref = "media3"

          [libraries.nextlib-media3ext]
          group = "io.github.nicekid1"
          name = "nextlib-media3ext"
          version.ref = "nextlib"

          [bundles]
          media3 = [
              "media3-common", "media3-exoplayer", "media3-exoplayer-dash",
              "media3-exoplayer-hls", "media3-exoplayer-rtsp",
              "media3-exoplayer-smoothstreaming", "media3-extractor",
              "media3-datasource", "media3-datasource-okhttp", "media3-datasource-rtmp",
              "media3-database", "media3-decoder", "media3-session",
              "media3-ui", "media3-ui-danmaku", "media3-container", "media3-effect"
          ]
          TOML

      - name: Patch app/build.gradle with media3 deps
        run: |
          # Add media3 bundle and nextlib after the 'implementation libs.media' line
          sed -i '/implementation libs\.media$/a\    implementation libs.bundles.media3\n    implementation libs.nextlib.media3ext' app/build.gradle

          # Add resolutionStrategy to force media3 version (inside configurations block)
          sed -i '/force libs\.okhttp/a\            eachDependency { details ->\n                if (details.requested.group == '\''androidx.media3'\'') {\n                    details.useVersion(libs.versions.media3.get())\n                    details.because('\''Use bundled Media3 build with danmaku and mpv APIs'\'')\n                }\n            }' app/build.gradle

      - name: Generate signing keystore
        run: |
          STORE_PWD=$(openssl rand -base64 32)
          keytool -genkeypair \
            -keystore "${{ github.workspace }}/keystore.jks" \
            -alias tv \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PWD" -keypass "$STORE_PWD" \
            -dname "CN=CI Build, O=TV, L=CI, ST=CI, C=CN"
          cat > local.properties << EOF
          storeFile=${{ github.workspace }}/keystore.jks
          keyAlias=tv
          storePassword=$STORE_PWD
          EOF

      - name: Build all release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleLeanbackArm64_v8aRelease \
                    assembleLeanbackArmeabi_v7aRelease \
                    assembleMobileArm64_v8aRelease \
                    assembleMobileArmeabi_v7aRelease

      - name: Collect APKs
        id: apk
        run: |
          mkdir -p output
          cp Release/apk/*.apk output/ 2>/dev/null || true
          find app/build/outputs/apk -name '*.apk' -path '*/release/*' -exec cp {} output/ \;
          ls -lh output/
          echo "count=$(ls output/*.apk 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-APKs-${{ github.run_number }}
          path: output/*.apk
          retention-days: 30

      - name: Determine release tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        id: tag
        run: echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: output/*.apk
          generate_release_notes: true
